<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monciškės Wind Speed Compass</title>
  <link rel="icon" href="favicon.ico">
  <style>
    :root {
      color-scheme: light;
      --ink: #18212f;
      --muted: #657085;
      --panel: #ffffff;
      --line: #d9e0e8;
      --soft: #eef3f7;
      --page: #f6f8fb;
      --blue: #2472a8;
      --teal: #0f8a7d;
      --green: #4c9a2a;
      --amber: #d88b19;
      --red: #bd4b41;
      --violet: #6656a8;
      --shadow: 0 10px 26px rgba(24, 33, 47, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--page);
    }
    header {
      padding: 24px clamp(16px, 3vw, 36px) 16px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }
    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      max-width: 1320px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.05;
      letter-spacing: 0;
    }
    .subtitle {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
      max-width: 760px;
    }
    .unit-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .segmented {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--soft);
      min-width: 116px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, .08);
    }
    .segmented button {
      border: 0;
      padding: 7px 11px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .segmented button.active {
      background: var(--ink);
      color: #fff;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }
    main {
      max-width: 1320px;
      margin: 0 auto;
      padding: 20px clamp(16px, 3vw, 36px) 42px;
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .kpi, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .kpi {
      padding: 14px 14px 12px;
      min-height: 118px;
    }
    .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .value {
      margin-top: 8px;
      font-size: 27px;
      line-height: 1;
      font-weight: 850;
      white-space: nowrap;
    }
    .detail {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(320px, .65fr);
      gap: 16px;
    }
    .panel {
      position: relative;
      padding: 16px;
      min-width: 0;
    }
    .panel h2 {
      margin: 0 0 4px;
      font-size: 17px;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .panel p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }
    .panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 16px;
      margin-bottom: 10px;
    }
    .panel-head p {
      margin-bottom: 0;
    }
    .year-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .year-tabs button {
      min-width: 62px;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .year-tabs button.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }
    .select-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      justify-items: center;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }
    .select-row label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    select {
      min-height: 36px;
      min-width: 112px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      padding: 6px 28px 6px 10px;
    }
    .button-stack {
      display: grid;
      align-items: center;
      justify-items: center;
      width: 100%;
    }
    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: none;
    }
    .selector-button {
      min-height: 36px;
      min-width: 58px;
      padding: 7px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 850;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, box-shadow .15s ease, color .15s ease;
    }
    .selector-button.active {
      background: var(--selector-color, var(--ink));
      border-color: var(--selector-color, var(--ink));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--selector-color, var(--ink)) 22%, transparent);
      color: #fff;
    }
    .selector-button:not(.active) {
      border-color: color-mix(in srgb, var(--selector-color, var(--line)) 55%, var(--line));
    }
    .year-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 4px 0 14px;
    }
    .mini-stat {
      min-height: 74px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
    }
    .mini-stat b {
      display: block;
      margin-top: 5px;
      font-size: 18px;
      line-height: 1.15;
    }
    .wide {
      grid-column: 1 / -1;
    }
    .compass-panel {
      padding-top: 56px;
    }
    .chart {
      width: 100%;
      min-height: 250px;
    }
    .compass-chart {
      min-height: 0;
      text-align: center;
    }
    .compass-chart svg {
      width: 100%;
      max-width: 560px;
      min-width: 320px;
      margin: 0 auto;
    }
    .daily-wind-chart {
      width: 100%;
      max-width: 1080px;
    }
    .compass-pair {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }
    .compass-days-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      margin-top: 16px;
    }
    .compass-card {
      display: grid;
      gap: 8px;
      justify-items: center;
    }
    .plot-action {
      display: flex;
      justify-content: center;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    .axis {
      color: var(--muted);
      font-size: 11px;
    }
    .legend {
      margin-top: 16px;
      font-size: 13px;
      overflow-x: auto;
    }
    .legend-table {
      width: 100%;
      min-width: 720px;
      border-collapse: separate;
      border-spacing: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 10px 24px rgba(15, 23, 42, .05);
    }
    .legend-table th,
    .legend-table td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
      vertical-align: middle;
    }
    .legend-table th {
      background: #f8fafc;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .legend-table th button {
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      cursor: pointer;
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }
    .legend-table th button:hover {
      color: var(--ink);
    }
    .legend-table tbody tr:hover {
      background: #fbfdff;
    }
    .legend-table tr:last-child td {
      border-bottom: 0;
    }
    .legend-table th:nth-child(n+3),
    .legend-table td:nth-child(n+3) {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .legend-table th:first-child,
    .legend-table td:first-child {
      width: 52px;
      text-align: center;
    }
    .legend-table th:nth-child(2),
    .legend-table td:nth-child(2) {
      width: 28%;
    }
    .swatch {
      width: 24px;
      height: 4px;
      border-radius: 999px;
      display: inline-block;
      flex: 0 0 auto;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .92), 0 0 0 4px rgba(15, 23, 42, .08);
    }
    .legend-period {
      font-weight: 850;
      color: var(--ink);
    }
    .load-error {
      padding: 12px 14px;
      border: 1px solid #f2c2bc;
      border-radius: 8px;
      background: #fff5f3;
      color: #9f2f27;
      font-weight: 800;
      text-align: center;
    }
    .insights {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .insight {
      padding: 14px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
    }
    .insight b {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .insight span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    .direction-list {
      display: grid;
      gap: 8px;
    }
    .dir-row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 54px;
      align-items: center;
      gap: 10px;
      min-height: 28px;
      font-size: 13px;
    }
    .stack {
      display: flex;
      height: 16px;
      overflow: hidden;
      border-radius: 5px;
      background: var(--soft);
      border: 1px solid #dbe3eb;
    }
    .stack div {
      min-width: 0;
      height: 100%;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 9px 8px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      white-space: nowrap;
    }
    th:first-child, td:first-child,
    th:nth-child(2), td:nth-child(2) {
      text-align: left;
    }
    th {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .note {
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px solid #edd5a8;
      background: #fff8eb;
      color: #6b4b15;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.45;
    }
    .footer-note {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    @media (max-width: 1100px) {
      .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr; }
      .insights { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      .topbar { display: block; }
      .panel-head { display: block; }
      .year-tabs { justify-content: flex-start; margin-top: 12px; }
      .select-row { justify-content: center; margin-top: 12px; }
      .button-stack { grid-template-columns: 1fr; justify-items: center; }
      .button-group { justify-content: center; max-width: none; }
      .year-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .unit-toggle { top: 13px; right: 13px; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .value { font-size: 23px; }
      .panel { padding: 13px; }
      .compass-panel { padding-top: 54px; }
      .compass-pair { grid-template-columns: 1fr; }
      .compass-chart svg { width: 100%; min-width: 0; }
      table { font-size: 12px; }
      th, td { padding: 8px 5px; }
    }
    @media (max-width: 440px) {
      .kpis { grid-template-columns: 1fr; }
    }
    :root { --ink: #4b4b4b; --muted: #757575; --line: #b0b0b0; --page: #ffffff; --soft: #f4f4f4; --shadow: none; }
    body { max-width: 1320px; min-height: 100vh; margin: 0 auto; padding: 0 20px; font-family: Verdana, Tahoma, sans-serif; line-height: 1.55; }
    header { min-height: 0; margin-top: 0; padding: 14px 0; border-top: 1px solid var(--line); background: transparent; }
    .topbar, main { max-width: 1320px; }
    h1 { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight: 100; line-height: 1.1; }
    .collection-note { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .collection-note a { color: inherit; }
    main { padding: 18px 0 36px; }
    .kpi, .panel, .legend-table { box-shadow: none; }
    .compass-panel { padding: 54px 0 0; border: 0; }
    .legend-table { border-radius: 0; }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div>
        <h1>Monciškės Wind Speed Compass</h1>
        <p id="collectionNote" class="collection-note"></p>
      </div>
    </div>
  </header>
  <main>
    <section class="grid">
      <div class="panel wide compass-panel">
        <div class="unit-toggle">
          <div class="segmented" aria-label="Speed units">
            <button id="msBtn" class="active" type="button">m/s</button>
            <button id="ktBtn" type="button">kt</button>
          </div>
        </div>
        <div class="panel-head">
          <div class="select-row">
            <div class="button-stack">
              <div class="button-group" id="compassYearButtons"></div>
            </div>
            <div class="button-stack">
              <div class="button-group" id="compassMonthButtons"></div>
            </div>
          </div>
        </div>
        <div class="compass-pair">
          <div class="compass-card">
            <div id="compassPlotAvg" class="chart compass-chart"></div>
            <div class="plot-action" id="compassAvgModeButton"></div>
          </div>
          <div class="compass-card">
            <div id="compassPlotMax" class="chart compass-chart"></div>
            <div class="plot-action" id="compassMaxModeButton"></div>
          </div>
        </div>
        <div class="compass-days-row">
          <div class="compass-card">
            <div id="dailyWindChart" class="chart daily-wind-chart"></div>
          </div>
        </div>
        <div class="legend" id="compassLegend">
        </div>
      </div>
    </section>
  </main>
  <script>
    let data = null;

    let unit = "ms";
    let selectedYear = "";
    let selectedCompassYears = [];
    let selectedCompassMonths = [];
    let averageAvgCompassProfiles = false;
    let averageMaxCompassProfiles = false;
    let legendSortKey = "period";
    let legendSortDir = "asc";
    const colors = {
      avg: "#2472a8",
      kite: "#4c9a2a",
      strong: "#bd4b41",
      calm: "#cfd9e3",
      light: "#d88b19",
      teal: "#0f8a7d",
      violet: "#6656a8",
      grid: "#d9e0e8",
      text: "#18212f",
      muted: "#657085"
    };
    const yearPalette = ["#2563eb", "#7c3aed", "#db2777", "#ea580c", "#16a34a", "#0891b2"];
    const monthPalette = ["#0f766e", "#65a30d", "#ca8a04", "#dc2626", "#9333ea", "#0284c7"];
    const overlayPalette = yearPalette.concat(monthPalette);

    const fmt = new Intl.NumberFormat("en", { maximumFractionDigits: 1 });
    const pctFmt = new Intl.NumberFormat("en", { maximumFractionDigits: 0 });

    function speed(valueMs) {
      return unit === "kt" ? valueMs * 1.9438444924406 : valueMs;
    }

    function unitLabel() {
      return unit === "kt" ? "kt" : "m/s";
    }

    function speedText(valueMs) {
      return `${fmt.format(speed(valueMs))} ${unitLabel()}`;
    }

    function pctText(value) {
      return `${pctFmt.format(value)}%`;
    }

    function setUnit(nextUnit) {
      unit = nextUnit;
      document.getElementById("msBtn").classList.toggle("active", unit === "ms");
      document.getElementById("ktBtn").classList.toggle("active", unit === "kt");
      render();
    }

    function setSelectedYear(year) {
      selectedYear = String(year);
      render();
    }

    function allCompassYears() {
      return data.yearly.map(item => String(item.year));
    }

    function allCompassMonths() {
      return data.monthly.map(item => String(item.month_number));
    }

    function isAllSelected(current, allValues) {
      return current.length === allValues.length && allValues.every(value => current.includes(value));
    }

    function toggleCompassSelection(kind, value) {
      const current = kind === "year" ? selectedCompassYears : selectedCompassMonths;
      let next;
      if (current.includes(value)) {
        next = current.filter(item => item !== value);
      } else {
        next = current.concat(value);
      }
      if (!next.length) {
        next = kind === "year" ? current : [];
      }
      if (kind === "year") {
        selectedCompassYears = next;
      } else {
        selectedCompassMonths = next;
      }
      render();
    }

    function toggleCompassAverage(mode) {
      if (mode === "max") {
        averageMaxCompassProfiles = !averageMaxCompassProfiles;
      } else {
        averageAvgCompassProfiles = !averageAvgCompassProfiles;
      }
      render();
    }

    function sortLegend(key) {
      if (legendSortKey === key) {
        legendSortDir = legendSortDir === "asc" ? "desc" : "asc";
      } else {
        legendSortKey = key;
        legendSortDir = key === "period" ? "asc" : "desc";
      }
      renderLegend();
    }

    document.getElementById("msBtn").addEventListener("click", () => setUnit("ms"));
    document.getElementById("ktBtn").addEventListener("click", () => setUnit("kt"));

    function linePath(points) {
      return points.map((point, index) => `${index === 0 ? "M" : "L"}${point[0].toFixed(1)},${point[1].toFixed(1)}`).join(" ");
    }

    function yearColor(year) {
      const index = data.yearly.findIndex(item => String(item.year) === String(year));
      return yearPalette[(index < 0 ? 0 : index) % yearPalette.length];
    }

    function monthColor(month) {
      const index = data.monthly.findIndex(item => String(item.month_number) === String(month));
      return monthPalette[(index < 0 ? 0 : index) % monthPalette.length];
    }

    function profileWithColor(profile, color) {
      if (!profile) {
        return null;
      }
      return Object.assign({}, profile, { color });
    }

    function combineProfiles(profiles, label) {
      const usable = profiles.filter(Boolean);
      const binCount = usable[0]?.bins.length || 0;
      const bins = Array.from({ length: binCount }, (_, index) => {
        const n = usable.reduce((sum, profile) => sum + profile.bins[index].n, 0);
        const weighted = usable.reduce((sum, profile) => sum + profile.bins[index].avg_ms * profile.bins[index].n, 0);
        const maxMs = Math.max(...usable.map(profile => profile.bins[index].max_ms), 0);
        return {
          deg: usable[0].bins[index].deg,
          dir: usable[0].bins[index].dir,
          n,
          avg_ms: n ? weighted / n : 0,
          max_ms: maxMs,
          kite_pct: 0
        };
      });
      const n = usable.reduce((sum, profile) => sum + profile.n, 0);
      const avg = usable.reduce((sum, profile) => sum + profile.avg_ms * profile.n, 0);
      return {
        label,
        n,
        avg_ms: n ? avg / n : 0,
        max_bin_ms: Math.max(...bins.map(item => item.avg_ms), 0),
        max_bin_gust_ms: Math.max(...bins.map(item => item.max_ms), 0),
        bins
      };
    }

    function averageProfiles(profiles, label) {
      const usable = profiles.filter(Boolean);
      const binCount = usable[0]?.bins.length || 0;
      const bins = Array.from({ length: binCount }, (_, index) => {
        const active = usable.filter(profile => profile.bins[index].n > 0);
        const source = usable[0].bins[index];
        const avgMs = active.length
          ? active.reduce((sum, profile) => sum + profile.bins[index].avg_ms, 0) / active.length
          : 0;
        const maxMs = active.length
          ? active.reduce((sum, profile) => sum + profile.bins[index].max_ms, 0) / active.length
          : 0;
        return {
          deg: source.deg,
          dir: source.dir,
          n: active.reduce((sum, profile) => sum + profile.bins[index].n, 0),
          avg_ms: avgMs,
          max_ms: maxMs,
          kite_pct: 0
        };
      });
      const n = usable.reduce((sum, profile) => sum + profile.n, 0);
      return {
        label,
        n,
        avg_ms: usable.length ? usable.reduce((sum, profile) => sum + profile.avg_ms, 0) / usable.length : 0,
        max_bin_ms: Math.max(...bins.map(item => item.avg_ms), 0),
        max_bin_gust_ms: Math.max(...bins.map(item => item.max_ms), 0),
        bins
      };
    }

    function compactMonthLabel(months) {
      return months.map(month => data.monthly.find(item => String(item.month_number) === String(month))?.month || month).join(", ");
    }

    function compassProfiles(averageEnabled) {
      const years = selectedCompassYears;
      const months = selectedCompassMonths;
      let profiles;
      if (!years.length) {
        return [];
      }
      if (!months.length) {
        profiles = years.map(year => profileWithColor(data.direction_profiles.years[year], yearColor(year))).filter(Boolean);
      } else if (years.length === 1) {
        profiles = months
          .map(month => profileWithColor(data.direction_profiles.year_months[`${years[0]}-${month}`], monthColor(month)))
          .filter(Boolean);
      } else if (months.length === 1) {
        profiles = years
          .map(year => profileWithColor(data.direction_profiles.year_months[`${year}-${months[0]}`], yearColor(year)))
          .filter(Boolean);
      } else {
        profiles = years.map(year => combineProfiles(
          months.map(month => data.direction_profiles.year_months[`${year}-${month}`]),
          `${year} ${compactMonthLabel(months)}`
        )).map(profile => profileWithColor(profile, yearColor(profile.label.slice(0, 4))));
      }
      if (averageEnabled && profiles.length > 1) {
        return [profileWithColor(averageProfiles(profiles, "Average"), colors.teal)];
      }
      return profiles;
    }

    function combineDailyWindProfiles(profiles, label) {
      const usable = profiles.filter(Boolean);
      const bins = usable[0]?.bins.map((source, index) => ({
        day: source.day,
        avg_ms: usable.length
          ? usable.reduce((sum, profile) => sum + profile.bins[index].avg_ms * profile.bins[index].days, 0) /
            Math.max(usable.reduce((sum, profile) => sum + profile.bins[index].days, 0), 1)
          : 0,
        days: usable.reduce((sum, profile) => sum + profile.bins[index].days, 0),
        dir_deg: weightedCircularMean(usable.map(profile => ({
          deg: profile.bins[index].dir_deg,
          weight: profile.bins[index].days
        })))
      })) || [];
      bins.forEach(bin => { bin.dir = directionLabel(bin.dir_deg); });
      return { label, bins };
    }

    function averageDailyWindProfiles(profiles, label) {
      const usable = profiles.filter(Boolean);
      const bins = usable[0]?.bins.map((source, index) => ({
        day: source.day,
        avg_ms: usable.length
          ? usable.reduce((sum, profile) => sum + profile.bins[index].avg_ms, 0) / usable.length
          : 0,
        days: usable.reduce((sum, profile) => sum + profile.bins[index].days, 0),
        dir_deg: weightedCircularMean(usable.map(profile => ({
          deg: profile.bins[index].dir_deg,
          weight: profile.bins[index].days
        })))
      })) || [];
      bins.forEach(bin => { bin.dir = directionLabel(bin.dir_deg); });
      return { label, bins };
    }

    function weightedCircularMean(values) {
      const usable = values.filter(value => Number.isFinite(value.deg) && value.weight > 0);
      if (!usable.length) return null;
      const sin = usable.reduce((sum, value) => sum + Math.sin(value.deg * Math.PI / 180) * value.weight, 0);
      const cos = usable.reduce((sum, value) => sum + Math.cos(value.deg * Math.PI / 180) * value.weight, 0);
      return (Math.atan2(sin, cos) * 180 / Math.PI + 360) % 360;
    }

    function directionLabel(degrees) {
      if (!Number.isFinite(degrees)) return "";
      const labels = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
      return labels[Math.round(degrees / 22.5) % labels.length];
    }

    function isEastSector(degrees) {
      return Number.isFinite(degrees) && degrees >= 45 && degrees <= 135;
    }

    function dailyWindProfiles(averageEnabled) {
      const years = selectedCompassYears;
      const months = selectedCompassMonths;
      let profiles;
      if (!years.length) {
        return [];
      }
      if (!months.length) {
        profiles = years.map(year => profileWithColor(data.daily_wind_profiles.years[year], yearColor(year))).filter(Boolean);
      } else if (years.length === 1) {
        profiles = months
          .map(month => profileWithColor(data.daily_wind_profiles.year_months[`${years[0]}-${month}`], monthColor(month)))
          .filter(Boolean);
      } else if (months.length === 1) {
        profiles = years
          .map(year => profileWithColor(data.daily_wind_profiles.year_months[`${year}-${months[0]}`], yearColor(year)))
          .filter(Boolean);
      } else {
        profiles = years.map(year => combineDailyWindProfiles(
          months.map(month => data.daily_wind_profiles.year_months[`${year}-${month}`]),
          `${year} ${compactMonthLabel(months)}`
        )).map(profile => profileWithColor(profile, yearColor(profile.label.slice(0, 4))));
      }
      if (averageEnabled && profiles.length > 1) {
        return [profileWithColor(averageDailyWindProfiles(profiles, "Average"), colors.teal)];
      }
      return profiles;
    }

    function compassPoint(cx, cy, radius, degrees) {
      const radians = degrees * Math.PI / 180;
      return [cx + Math.sin(radians) * radius, cy - Math.cos(radians) * radius];
    }

    function renderCompassControls() {
      const yearButtons = data.yearly.map(item => ({ label: String(item.year), value: String(item.year) }));
      const monthButtons = data.monthly.map(item => ({ label: item.month, value: String(item.month_number) }));
      document.getElementById("compassYearButtons").innerHTML = yearButtons.map(item => `
        <button type="button" style="--selector-color:${yearColor(item.value)}" class="selector-button ${selectedCompassYears.includes(item.value) ? "active" : ""}" onclick="toggleCompassSelection('year', '${item.value}')">${item.label}</button>
      `).join("");
      document.getElementById("compassMonthButtons").innerHTML = monthButtons.map(item => `
        <button type="button" style="--selector-color:${monthColor(item.value)}" class="selector-button ${selectedCompassMonths.includes(item.value) ? "active" : ""}" onclick="toggleCompassSelection('month', '${item.value}')">${item.label}</button>
      `).join("");
      document.getElementById("compassAvgModeButton").innerHTML = `
        <button type="button" style="--selector-color:${colors.teal}" class="selector-button ${averageAvgCompassProfiles ? "active" : ""}" onclick="toggleCompassAverage('avg')">Average</button>
      `;
      document.getElementById("compassMaxModeButton").innerHTML = `
        <button type="button" style="--selector-color:${colors.teal}" class="selector-button ${averageMaxCompassProfiles ? "active" : ""}" onclick="toggleCompassAverage('max')">Average</button>
      `;
    }

    function sortMark(key) {
      if (legendSortKey !== key) {
        return "";
      }
      return legendSortDir === "asc" ? "<span aria-hidden=\"true\">↑</span>" : "<span aria-hidden=\"true\">↓</span>";
    }

    function legendRows() {
      const profiles = compassProfiles(averageAvgCompassProfiles && averageMaxCompassProfiles).filter(Boolean);
      return profiles.map((profile, index) => {
        const strongest = profile.bins.reduce((best, item) => item.avg_ms > best.avg_ms ? item : best, profile.bins[0]);
        const maxWind = Math.max(...profile.bins.map(item => item.max_ms), 0);
        return {
          color: profile.color || overlayPalette[index % overlayPalette.length],
          period: profile.label,
          readings: profile.n,
          avg: profile.avg_ms,
          strongest: strongest ? strongest.avg_ms : 0,
          strongestDir: strongest ? `${strongest.deg}° ${strongest.dir}` : "-",
          max: maxWind
        };
      }).sort((a, b) => {
        const dir = legendSortDir === "asc" ? 1 : -1;
        if (legendSortKey === "period") {
          return a.period.localeCompare(b.period) * dir;
        }
        return (a[legendSortKey] - b[legendSortKey]) * dir;
      });
    }

    function renderLegend() {
      const rows = legendRows();
      document.getElementById("compassLegend").innerHTML = `
        <table class="legend-table">
          <colgroup>
            <col style="width:52px">
            <col>
            <col style="width:118px">
            <col style="width:120px">
            <col style="width:150px">
            <col style="width:120px">
          </colgroup>
          <thead>
            <tr>
              <th>Line</th>
              <th><button type="button" onclick="sortLegend('period')">Period${sortMark("period")}</button></th>
              <th><button type="button" onclick="sortLegend('readings')">Readings${sortMark("readings")}</button></th>
              <th><button type="button" onclick="sortLegend('avg')">Avg Wind${sortMark("avg")}</button></th>
              <th><button type="button" onclick="sortLegend('strongest')">Strongest Bin${sortMark("strongest")}</button></th>
              <th><button type="button" onclick="sortLegend('max')">Max Wind${sortMark("max")}</button></th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(row => `
              <tr>
                <td><i class="swatch" style="background:${row.color}"></i></td>
                <td class="legend-period">${row.period}</td>
                <td>${row.readings.toLocaleString()}</td>
                <td>${speedText(row.avg)}</td>
                <td>${row.strongestDir} · ${speedText(row.strongest)}</td>
                <td>${speedText(row.max)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function renderCompassPlot(targetId, mode) {
      const profiles = compassProfiles(mode === "max" ? averageMaxCompassProfiles : averageAvgCompassProfiles).filter(Boolean);
      const width = 560;
      const height = 480;
      const cx = width / 2;
      const cy = 238;
      const radius = 170;
      const isMax = mode === "max";
      const valueFor = item => isMax ? item.max_ms : item.avg_ms;
      const maxForProfile = profile => isMax
        ? Math.max(...profile.bins.map(item => item.max_ms), 0)
        : profile.max_bin_ms;
      const maxValue = Math.max(...profiles.map(maxForProfile), 1);
      const rings = [0.25, 0.5, 0.75, 1];
      const ringSvg = rings.map(scale => `
        <circle cx="${cx}" cy="${cy}" r="${radius * scale}" fill="none" stroke="${colors.grid}" stroke-width="1"/>
      `).join("");
      const ringLabels = rings.map(scale => {
        const label = `${fmt.format(speed(maxValue * scale))} ${unitLabel()}`;
        const y = cy - radius * scale;
        return `
          <g>
            <rect x="${cx + 8}" y="${y - 12}" width="58" height="20" rx="5" fill="rgba(255,255,255,.86)" stroke="${colors.grid}"/>
            <text x="${cx + 37}" y="${y + 3}" text-anchor="middle" fill="${colors.text}" font-size="13" font-weight="850">${label}</text>
          </g>
        `;
      }).join("");
      const degreeTicks = Array.from({ length: 24 }, (_, index) => index * 15).map(deg => {
        const outer = compassPoint(cx, cy, radius + 2, deg);
        const inner = compassPoint(cx, cy, radius - (deg % 45 === 0 ? 12 : 7), deg);
        const label = compassPoint(cx, cy, radius + 28, deg);
        const showLabel = deg % 30 === 0;
        const cardinalLabels = { 0: "N", 90: "E", 180: "S", 270: "W" };
        const labelText = cardinalLabels[deg] || String(deg) + "°";
        const isCardinal = Boolean(cardinalLabels[deg]);
        return `
          <line x1="${inner[0]}" y1="${inner[1]}" x2="${outer[0]}" y2="${outer[1]}" stroke="${colors.muted}" stroke-width="${deg % 45 === 0 ? 1.6 : 1}"/>
          ${showLabel ? `<text x="${label[0]}" y="${label[1] + (isCardinal ? 6 : 4)}" text-anchor="middle" fill="${isCardinal ? colors.text : colors.muted}" font-size="${isCardinal ? 17 : 11}" font-weight="${isCardinal ? 850 : 500}">${labelText}</text>` : ""}
        `;
      }).join("");
      const spokes = [0, 45, 90, 135, 180, 225, 270, 315].map(deg => {
        const point = compassPoint(cx, cy, radius, deg);
        return `<line x1="${cx}" y1="${cy}" x2="${point[0]}" y2="${point[1]}" stroke="${colors.grid}" stroke-width="1"/>`;
      }).join("");
      const coastTop = [cx - 8, cy - radius];
      const coastBottom = [cx - 16, cy + radius];
      const coastCurve = `M${coastTop[0]},${coastTop[1]}
        C${cx - 28},${cy - 112} ${cx + 10},${cy - 62} ${cx - 12},${cy - 8}
        C${cx - 34},${cy + 46} ${cx + 18},${cy + 102} ${coastBottom[0]},${coastBottom[1]}`;
      const seaPath = `M${cx - radius},${cy - radius}
        L${coastTop[0]},${coastTop[1]}
        C${cx - 28},${cy - 112} ${cx + 10},${cy - 62} ${cx - 12},${cy - 8}
        C${cx - 34},${cy + 46} ${cx + 18},${cy + 102} ${coastBottom[0]},${coastBottom[1]}
        L${cx - radius},${cy + radius} Z`;
      const sandPath = `M${coastTop[0]},${coastTop[1]}
        L${cx + radius},${cy - radius}
        L${cx + radius},${cy + radius}
        L${coastBottom[0]},${coastBottom[1]}
        C${cx + 18},${cy + 102} ${cx - 34},${cy + 46} ${cx - 12},${cy - 8}
        C${cx + 10},${cy - 62} ${cx - 28},${cy - 112} ${coastTop[0]},${coastTop[1]} Z`;
      const eastArcOuter = Array.from({ length: 19 }, (_, i) => compassPoint(cx, cy, radius, 45 + i * 5));
      const eastArcInner = Array.from({ length: 19 }, (_, i) => compassPoint(cx, cy, radius * .12, 135 - i * 5));
      const eastSectorPath = `M${eastArcOuter[0][0]},${eastArcOuter[0][1]} ` +
        eastArcOuter.slice(1).map(p => `L${p[0]},${p[1]}`).join(" ") + " " +
        eastArcInner.map(p => `L${p[0]},${p[1]}`).join(" ") + " Z";
      const overlays = profiles.map((profile, profileIndex) => {
        const color = profile.color || overlayPalette[profileIndex % overlayPalette.length];
        const points = profile.bins.map(item => {
          const r = (speed(valueFor(item)) / Math.max(speed(maxValue), 0.1)) * radius;
          return compassPoint(cx, cy, r, item.deg);
        });
        const area = points.length ? `${linePath(points)} Z` : "";
        const markers = profiles.length <= 3 ? profile.bins.map((item, index) => {
          const point = points[index];
          const hasValue = item.n > 0;
          const dotRadius = hasValue ? 3.2 : 2;
          const detail = `${speedText(valueFor(item))} ${isMax ? "max" : "avg"}, ${item.n} readings`;
          return `<circle cx="${point[0]}" cy="${point[1]}" r="${dotRadius}" fill="${hasValue ? color : "#b8c4cf"}"><title>${profile.label} · ${item.deg}° ${item.dir}: ${detail}</title></circle>`;
        }).join("") : "";
        const hoverTargets = profile.bins.map((item, index) => {
          const point = points[index];
          const detail = `${speedText(valueFor(item))} ${isMax ? "max" : "avg"}, ${item.n} readings`;
          return `<circle cx="${point[0]}" cy="${point[1]}" r="10" fill="transparent" stroke="transparent" style="pointer-events:all"><title>${profile.label} · ${item.deg}° ${item.dir}: ${detail}</title></circle>`;
        }).join("");
        return `
          <path d="${area}" fill="${profileIndex === 0 ? color : "transparent"}" fill-opacity=".12" stroke="${color}" stroke-width="${profiles.length > 4 ? 2.4 : 3.5}" stroke-linejoin="round"><title>${profile.label} · ${(isMax ? "maximum" : "average")} wind profile</title></path>
          ${markers}
          ${hoverTargets}
        `;
      }).join("");
      document.getElementById(targetId).innerHTML = `
        <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Wind strength compass plot">
          <defs>
            <clipPath id="compassClip"><circle cx="${cx}" cy="${cy}" r="${radius}"/></clipPath>
          </defs>
          <g clip-path="url(#compassClip)">
            <path d="${seaPath}" fill="#9fcfdf"/>
            <path d="${sandPath}" fill="#e8d2a6"/>
            <path d="${coastCurve}" fill="none" stroke="#f7efd8" stroke-width="8" stroke-linecap="round"/>
            <path d="${coastCurve}" fill="none" stroke="#6aaabd" stroke-width="2" stroke-linecap="round" opacity=".7"/>
            <path d="${eastSectorPath}" fill="rgba(246, 248, 251, .42)" stroke="none"/>
          </g>
          ${ringSvg}
          ${spokes}
          ${degreeTicks}
          <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${colors.muted}" stroke-width="1.5"/>
          ${overlays}
          ${ringLabels}
          <text x="${cx}" y="24" text-anchor="middle" fill="${colors.text}" font-size="18" font-weight="850">${isMax ? "Max Speed" : "Average Speed"}</text>
        </svg>
      `;
    }

    function renderDailyWindChart() {
      const profiles = dailyWindProfiles(false).filter(Boolean);
      const width = 1040;
      const height = 340;
      const margin = { top: 38, right: 30, bottom: 42, left: 56 };
      const innerW = width - margin.left - margin.right;
      const innerH = height - margin.top - margin.bottom;
      const maxValue = Math.max(...profiles.flatMap(profile => profile.bins.map(bin => speed(bin.avg_ms))), 1);
      const x = day => margin.left + ((day - 1) / 30) * innerW;
      const y = value => margin.top + innerH - (speed(value) / maxValue) * innerH;
      const grid = [0, .25, .5, .75, 1].map(scale => {
        const value = maxValue * scale;
        const gridY = y(unit === "kt" ? value / 1.9438444924406 : value);
        return `<line x1="${margin.left}" x2="${width - margin.right}" y1="${gridY}" y2="${gridY}" stroke="${colors.grid}"/><text class="axis" x="${margin.left - 9}" y="${gridY + 4}" text-anchor="end">${fmt.format(value)}</text>`;
      }).join("");
      const xLabels = [1, 5, 10, 15, 20, 25, 30, 31].map(day =>
        `<text class="axis" x="${x(day)}" y="${height - 16}" text-anchor="middle">${day}</text>`
      ).join("");
      const lines = profiles.map((profile, index) => {
        const color = profile.color || overlayPalette[index % overlayPalette.length];
        const points = profile.bins.filter(bin => bin.days > 0).map(bin => [x(bin.day), y(bin.avg_ms)]);
        const path = linePath(points);
        const markers = profiles.length <= 4 ? profile.bins.filter(bin => bin.days > 0).map(bin => {
          const direction = Number.isFinite(bin.dir_deg) ? `${bin.dir} (${Math.round(bin.dir_deg)}°)` : "unknown";
          const arrowHidden = isEastSector(bin.dir_deg);
          const tooltip = `${profile.label} · day ${bin.day}: ${speedText(bin.avg_ms)} daily average, direction ${direction}${arrowHidden ? " (arrow hidden: east sector)" : ""} (${bin.days} day${bin.days === 1 ? "" : "s"})`;
          const arrow = !arrowHidden && Number.isFinite(bin.dir_deg)
            ? `<g transform="translate(${x(bin.day)} ${y(bin.avg_ms)}) rotate(${bin.dir_deg})" pointer-events="none"><path d="M 0 -7 L 4.5 5 L 0 2.5 L -4.5 5 Z" fill="${color}" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/></g>`
            : "";
          return `${arrow}<circle cx="${x(bin.day)}" cy="${y(bin.avg_ms)}" r="10" fill="transparent" stroke="transparent" style="pointer-events:all"><title>${tooltip}</title></circle>`;
        }).join("") : "";
        return `<path d="${path}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><title>${profile.label} daily average wind</title></path>${markers}`;
      }).join("");
      document.getElementById("dailyWindChart").innerHTML = `
        <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Daily average wind by day of month">
          ${grid}
          <line x1="${margin.left}" x2="${width - margin.right}" y1="${margin.top + innerH}" y2="${margin.top + innerH}" stroke="${colors.grid}"/>
          ${xLabels}
          ${lines}
          <text x="${width / 2}" y="20" text-anchor="middle" fill="${colors.text}" font-size="18" font-weight="850">Daily Average Wind</text>
          <text class="axis" x="${margin.left}" y="20">${unitLabel()}</text>
        </svg>
      `;
    }

    function render() {
      if (!data) {
        return;
      }
      renderCompassControls();
      renderCompassPlot("compassPlotAvg", "avg");
      renderCompassPlot("compassPlotMax", "max");
      renderDailyWindChart();
      renderLegend();
    }

    function initializeDashboard() {
      const collection = data.collection;
      document.getElementById("collectionNote").innerHTML = 'Data source: <a href="' + collection.source_url + '" target="_blank" rel="noopener noreferrer">' + collection.source + '</a> wind meter. Collected from ' + collection.start + ' to ' + collection.end + '.';
      selectedYear = String(data.yearly[data.yearly.length - 1].year);
      selectedCompassYears = [String(data.default_compass_selection.year)];
      selectedCompassMonths = data.default_compass_selection.months.map(String);
      render();
    }

    async function loadDashboardData() {
      try {
        const response = await fetch("monciskes_wind_compass_data.json");
        if (!response.ok) {
          throw new Error(`Wind data request failed: ${response.status}`);
        }
        data = await response.json();
        initializeDashboard();
      } catch (error) {
        console.error(error);
        document.getElementById("compassLegend").innerHTML = '<div class="load-error">Could not load wind data.</div>';
      }
    }

    loadDashboardData();
  </script>
</body>
</html>
